name: Publish GHCR image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    name: Build and publish linux/amd64 and linux/arm64
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Choose image name and version
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="$(cat internal/version/VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag must match internal/version/VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=sha,prefix=sha-
          flavor: latest=true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: TUNETRAIL_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        shell: bash
        run: |
          docker run -d --name tunetrail-release-smoke -p 127.0.0.1:14110:4110 \
            -e TUNETRAIL_DEFAULT_PASSWORD="$(openssl rand -hex 24)" \
            -e TUNETRAIL_LOG_LEVEL=warn -e TUNETRAIL_SKIP_IMPORT=true \
            -e TUNETRAIL_DISABLE_MUSICBRAINZ=true -e TUNETRAIL_DISABLE_DEEZER=true \
            -e TUNETRAIL_DISABLE_COVER_ART_ARCHIVE=true "$IMAGE"
          trap 'docker rm -f tunetrail-release-smoke >/dev/null' EXIT
          healthy=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:14110/apis/web/v1/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          curl --fail --silent http://127.0.0.1:14110/default >/dev/null
          curl --fail --silent http://127.0.0.1:14110/apis/web/v1/profiles | python3 -c 'import json,sys; p=json.load(sys.stdin); assert len(p)==1 and p[0]["slug"]=="default"'
