name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Go and multiuser validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The version rises once per published task (ISSUE-060), so ordinary commits
      # may keep it; publish commits are checked strictly by make issue.publish.
      - name: Check synchronized and non-decreasing version
        run: python3 scripts/version.py --check-not-lower
      - name: Validate language catalogs and localization
        run: go test ./internal/i18n ./internal/webui -run 'Test(Catalog|PresentationLocale|LocalizedRelativeTime)'
      # make check includes the end-to-end journeys (scripts/e2e.py) and the
      # unit tests of the version and issue workflow scripts.
      - run: make check
      - name: Verify static Linux builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/tunetrail-linux-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/tunetrail-linux-arm64 ./cmd/api
      - name: Verify migration and isolation with the race detector
        run: CGO_ENABLED=1 go test -race ./internal/db/sqlite ./engine -run 'Test(Profile|Consolidated|AdminAccount)' -timeout 120s
      - name: Validate deployment configuration
        env:
          KOITO_ADMIN_PASSWORD: ci-validation-only-password
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet

  container:
    name: Container build and startup
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production container
        run: docker build -t tunetrail:ci .
      - name: Verify container startup and Go interface
        shell: bash
        run: |
          # smoke NAME [docker run options...]: start, check health and pages, stop cleanly.
          smoke() {
            local name=$1; shift
            docker run -d --name "$name" -p 127.0.0.1:14110:4110 \
              --health-interval=2s --health-start-period=0s --health-retries=15 "$@" tunetrail:ci
            healthy=false
            for attempt in {1..60}; do
              if curl --fail --silent http://127.0.0.1:14110/apis/web/v1/health >/dev/null; then
                healthy=true
                break
              fi
              sleep 2
            done
            test "$healthy" = true
            curl --fail --silent http://127.0.0.1:14110/default >/dev/null
            curl --fail --silent http://127.0.0.1:14110/apis/web/v1/profiles | python3 -c 'import json,sys; p=json.load(sys.stdin); assert len(p)==1 and p[0]["slug"]=="default"'
            for attempt in {1..30}; do
              test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy && break
              sleep 2
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy
          }
          stop() {
            docker stop --time 20 "$1" >/dev/null
            test "$(docker inspect --format '{{.State.ExitCode}}' "$1")" = 0
          }
          trap 'docker rm -f tunetrail-ci tunetrail-ci-legacy tunetrail-ci-oldpath >/dev/null 2>&1; docker volume rm -f tunetrail-ci-legacy tunetrail-ci-oldpath >/dev/null 2>&1' EXIT
          # Current TUNETRAIL_* names (ISSUE-111).
          smoke tunetrail-ci \
            -e TUNETRAIL_DEFAULT_PASSWORD="$(openssl rand -hex 24)" \
            -e TUNETRAIL_LOG_LEVEL=warn -e TUNETRAIL_SKIP_IMPORT=true \
            -e TUNETRAIL_DISABLE_MUSICBRAINZ=true -e TUNETRAIL_DISABLE_DEEZER=true \
            -e TUNETRAIL_DISABLE_COVER_ART_ARCHIVE=true
          docker exec tunetrail-ci sh -c '! dpkg-query -W libvips42 >/dev/null 2>&1 && test -s /etc/ssl/certs/ca-certificates.crt && test -f /usr/share/zoneinfo/America/Sao_Paulo && test -f /etc/tunetrail/tunetrail.db'
          # Read logs first: grep -q closing the pipe early would fail under pipefail.
          logs=$(docker logs tunetrail-ci 2>&1)
          ! grep -q 'is deprecated' <<<"$logs"
          stop tunetrail-ci
          # Legacy KOITO_* names with a custom data directory, as an Unraid upgrade
          # would run: the image must not override the directory (ISSUE-111).
          smoke tunetrail-ci-legacy -v tunetrail-ci-legacy:/data \
            -e KOITO_CONFIG_DIR=/data \
            -e KOITO_DEFAULT_PASSWORD="$(openssl rand -hex 24)" \
            -e KOITO_LOG_LEVEL=warn -e KOITO_SKIP_IMPORT=true \
            -e KOITO_DISABLE_MUSICBRAINZ=true -e KOITO_DISABLE_DEEZER=true \
            -e KOITO_DISABLE_COVER_ART_ARCHIVE=true
          docker exec tunetrail-ci-legacy sh -c 'test -f /data/tunetrail.db && test ! -e /etc/tunetrail/tunetrail.db'
          logs=$(docker logs tunetrail-ci-legacy 2>&1)
          grep -q 'KOITO_CONFIG_DIR is deprecated' <<<"$logs"
          stop tunetrail-ci-legacy
          # Volume still mounted at the old /etc/koito with no *_CONFIG_DIR, as an old
          # template would run the new image: data must stay on that volume (ISSUE-111).
          smoke tunetrail-ci-oldpath -v tunetrail-ci-oldpath:/etc/koito \
            -e TUNETRAIL_DEFAULT_PASSWORD="$(openssl rand -hex 24)" \
            -e TUNETRAIL_LOG_LEVEL=warn -e TUNETRAIL_SKIP_IMPORT=true \
            -e TUNETRAIL_DISABLE_MUSICBRAINZ=true -e TUNETRAIL_DISABLE_DEEZER=true \
            -e TUNETRAIL_DISABLE_COVER_ART_ARCHIVE=true
          docker exec tunetrail-ci-oldpath sh -c 'test -f /etc/koito/tunetrail.db && test ! -e /etc/tunetrail/tunetrail.db'
          logs=$(docker logs tunetrail-ci-oldpath 2>&1)
          grep -q 'using the legacy data directory /etc/koito' <<<"$logs"
          stop tunetrail-ci-oldpath
