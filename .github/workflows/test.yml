name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Go and multiuser validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test versioning rules
        run: python3 -m unittest scripts.test_version
      - name: Check synchronized and incrementing version
        run: python3 scripts/version.py --check-parent
      - run: make check
      - run: make multiuser.check
      - name: Verify static Linux builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/tunetrail-linux-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/tunetrail-linux-arm64 ./cmd/api
      - name: Verify migration and isolation with the race detector
        run: CGO_ENABLED=1 go test -race ./internal/db/sqlite ./engine -run 'Test(Profile|Consolidated|AdminAccount)' -timeout 120s
      - name: Validate deployment configuration
        env:
          KOITO_ADMIN_PASSWORD: ci-validation-only-password
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet

  container:
    name: Container build and startup
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production container
        run: docker build -t tunetrail:ci .
      - name: Verify container startup and Go interface
        shell: bash
        run: |
          docker run -d --name tunetrail-ci -p 127.0.0.1:14110:4110 \
            --health-interval=2s --health-start-period=0s --health-retries=15 \
            -e KOITO_DEFAULT_PASSWORD="$(openssl rand -hex 24)" \
            -e KOITO_LOG_LEVEL=warn -e KOITO_SKIP_IMPORT=true \
            -e KOITO_DISABLE_MUSICBRAINZ=true -e KOITO_DISABLE_DEEZER=true \
            -e KOITO_DISABLE_COVER_ART_ARCHIVE=true tunetrail:ci
          trap 'docker rm -f tunetrail-ci >/dev/null' EXIT
          healthy=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:14110/apis/web/v1/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          curl --fail --silent http://127.0.0.1:14110/default >/dev/null
          curl --fail --silent http://127.0.0.1:14110/apis/web/v1/profiles | python3 -c 'import json,sys; p=json.load(sys.stdin); assert len(p)==1 and p[0]["slug"]=="default"'
          for attempt in {1..30}; do
            test "$(docker inspect --format '{{.State.Health.Status}}' tunetrail-ci)" = healthy && break
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' tunetrail-ci)" = healthy
          docker exec tunetrail-ci sh -c '! dpkg-query -W libvips42 >/dev/null 2>&1 && test -s /etc/ssl/certs/ca-certificates.crt && test -f /usr/share/zoneinfo/America/Sao_Paulo'
          docker stop --time 20 tunetrail-ci >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' tunetrail-ci)" = 0
