# Copy to conf.toml in TUNETRAIL_CONFIG_DIR (default /etc/tunetrail) and adjust for your installation.
# All values here are fictional examples. Environment variables take precedence.
schema_version = 1

[logging]
level = "info"

[musicbrainz]
url = "https://musicbrainz.org"
rate_limit = 1
disabled = false

[images]
disable_deezer = false
disable_cover_art_archive = false
lastfm_api_key = ""

[subsonic]
url = ""
params = ""

[time]
force_tz = ""
