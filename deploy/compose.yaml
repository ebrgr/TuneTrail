name: koito-sum

services:
  koito:
    image: ghcr.io/ebrgr/tunetrail:${KOITO_IMAGE_TAG:-0.6}
    restart: unless-stopped
    ports:
      - "${KOITO_HOST_BIND:-127.0.0.1}:${KOITO_HOST_PORT:-4110}:4110"
    environment:
      KOITO_CONFIG_DIR: /etc/koito
      KOITO_BIND_ADDR: 0.0.0.0
      KOITO_LISTEN_PORT: "4110"
      KOITO_DEFAULT_USERNAME: ${KOITO_ADMIN_USERNAME:-admin}
      KOITO_DEFAULT_PASSWORD: ${KOITO_ADMIN_PASSWORD:?Set KOITO_ADMIN_PASSWORD in deploy/.env before starting}
      KOITO_SKIP_IMPORT: "true"
      TZ: ${KOITO_TIMEZONE:-Etc/UTC}
    volumes:
      - ${KOITO_DATA_DIR:-./data}:/etc/koito
    stop_grace_period: 30s
