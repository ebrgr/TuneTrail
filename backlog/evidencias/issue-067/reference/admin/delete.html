        <main id="admin-main" class="admin-main">
          <h1>Delete profile Fictional Alpha</h1>
          <p>Profile alpha (ID 1) currently has 2 listens. Its keys, relay and listening history will be removed. The administrator account and shared catalog remain.</p>
          <form method="post" action="/admin/profile/1/delete">
            <input type="hidden" name="csrf_token" value="REFERENCE_TOKEN">
            
              <input type="hidden" name="submission_token" value="REFERENCE_TOKEN">
            
            <input type="hidden" name="profile_slug" value="alpha">
            <input type="hidden" name="listen_count" value="2">
            <label>Type the profile name <input name="display_name" required></label>
            <label><input type="checkbox" name="confirm" value="1" required> Confirm permanent deletion</label>
            <button>Delete profile</button>
          </form>
          <p><a href="/admin?profile=1">Cancel</a></p>
